name: Release

# Pushing a tag vX.Y.Z builds the binaries, signs their checksums and publishes a
# GitHub release. Running agents find it with their update check and verify the
# signature against the public key in release_key.go before installing anything.
#
# A release candidate tag vX.Y.Z-rc.N runs the same build in the UAT environment and
# publishes a pre-release. Agents never update to pre-releases (update.go), so an RC
# reaches only machines it is installed on by hand for UAT. A vX.Y.Z tag runs in the
# Production environment, which waits for the owner's approval before the job starts.
#
# The lifecycle:
#   vX.Y.Z-rc.N  -> build, sign, publish pre-release -> UAT jobs test that published build
#                   (full test gate, SAST, DAST, the UAT scripts, upgrade and service tests).
#                   The run is green only if every UAT job passes.
#   vX.Y.Z       -> "UAT passed" checks for a green RC run on the same commit, then the
#                   Production environment waits for approval, then build, sign, publish.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

# One run per tag, never cancelled halfway (a half-published release is worse than a queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uat-passed:
    name: UAT passed for this commit
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the RC's workflow runs
    steps:
      - name: Require a release candidate of this version, on this commit, whose UAT jobs all passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          UAT_JOBS: "4" # the "UAT:" jobs below; keep in step when adding or removing one
        run: |
          # A green run is not enough: skipped jobs leave a run green, so count UAT jobs that succeeded.
          ids=$(gh api "repos/$REPO/actions/workflows/release.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_branch | startswith(\"$TAG-rc.\")) | \"\(.id):\(.head_branch)\"")
          for entry in $ids; do
            id=${entry%%:*}; rc=${entry#*:}
            passed=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("UAT:")) | select(.conclusion == "success")] | length')
            echo "$rc (run $id): $passed of $UAT_JOBS UAT jobs passed"
            if [ "$passed" -ge "$UAT_JOBS" ]; then
              echo "UAT passed on this commit as $rc"
              exit 0
            fi
          done
          echo "::error::No release candidate ${TAG}-rc.N on ${SHA} passed all ${UAT_JOBS} UAT jobs. Tag one on this commit and let its UAT pass first."
          exit 1

  build:
    name: Build and scan
    needs: uat-passed
    # Runs for an RC (uat-passed is skipped) and for a release whose UAT passed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # Read-only and no secrets: tests, compilers and scanners run here, apart from the signing key and the write token.
    steps:
      # Actions pinned to commit SHAs, so a re-pointed tag cannot run code in a release.
      # Dependabot (github-actions) keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # newest toolchain: release builds pick up stdlib security fixes
          check-latest: true
          cache: false # no shared cache in a release build (cache poisoning)

      - name: README mentions the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          BASE=${TAG%%-*} # an RC is checked against the release it leads to
          grep -q "${BASE}" README.md || { echo "README.md does not mention ${BASE} (update What's new and Status first)"; exit 1; }

      - name: Tests
        run: go test -count=1 ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/easm-agent-${os}-${arch}${ext}" .
          done

      - name: Vulnerability scan of the binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 # pinned: an exact, checksum-verified module version
          go build -trimpath -ldflags "-X main.version=${TAG#v}" -o "$RUNNER_TEMP/easm-agent-unstripped" .
          govulncheck -mode=binary "$RUNNER_TEMP/easm-agent-unstripped"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Sign and publish
    needs: build
    # !cancelled(): uat-passed, an ancestor, is skipped for an RC, which would otherwise skip this job.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-rc.') && 'UAT' || 'Production' }}
    permissions:
      contents: write # create the release
      id-token: write # build provenance (OIDC identity for the attestation)
      attestations: write # build provenance
    steps:
      # Only first-party code runs here: this job holds the signing key and a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh gets the token through GH_TOKEN in the one step that publishes

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Checksums and signature
        env:
          EASM_RELEASE_SIGNING_KEY: ${{ secrets.EASM_RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$EASM_RELEASE_SIGNING_KEY" ]; then
            echo "The EASM_RELEASE_SIGNING_KEY secret is not set; see RELEASING.md"; exit 1
          fi
          go run ./tools/release sums -version "${TAG#v}" -dir dist
          go run ./tools/release sign -dir dist
          go run ./tools/release verify -dir dist

      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; case "$TAG" in *-rc.*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag $pre --title "EASM Agent ${TAG#v}" --generate-notes

  # ---- UAT: runs only for an RC, against the commit and the build it just published ----

  uat-gate:
    name: "UAT: full test gate"
    needs: release
    # !cancelled(): without a status function GitHub skips this job, because uat-passed (an ancestor) is skipped for an RC.
    if: ${{ !cancelled() && needs.release.result == 'success' && contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above need formatting"; exit 1; }
          go vet ./...

      - name: Install golangci-lint and Gitleaks (checksum-verified releases)
        env:
          GOLANGCI_LINT_VERSION: "2.15.0"
          GOLANGCI_LINT_SHA256: "9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea"
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          curl -sSfL -o "$RUNNER_TEMP/golangci-lint.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${archive}.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  $RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "${archive}/golangci-lint"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Lint (Linux and Windows code)
        run: |
          "$RUNNER_TEMP/golangci-lint" run ./...
          GOOS=windows "$RUNNER_TEMP/golangci-lint" run ./...

      - name: Tests, race detector, three times over (flakiness and stress)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=3 -timeout 60m ./...

      - name: Fuzz every target for 30s
        run: |
          for t in $(go test -list '^Fuzz' . | grep '^Fuzz'); do
            echo "== $t"
            go test -run '^$' -fuzz "^${t}\$" -fuzztime 30s .
          done

      - name: Dependency scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Secret scan (full history)
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --exit-code 1 .'

  uat-sast:
    name: "UAT: static analysis (Semgrep)"
    needs: release
    # !cancelled(): without a status function GitHub skips this job, because uat-passed (an ancestor) is skipped for an RC.
    if: ${{ !cancelled() && needs.release.result == 'success' && contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep on the whole code base
        run: >-
          semgrep scan --error --metrics=off
          --config p/default --config p/golang --config p/secrets --config p/owasp-top-ten
          --exclude web/static .

  uat-dast:
    name: "UAT: dynamic scan (ZAP) of the published Linux build"
    needs: release
    # !cancelled(): without a status function GitHub skips this job, because uat-passed (an ancestor) is skipped for an RC.
    if: ${{ !cancelled() && needs.release.result == 'success' && contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Download the pre-release and verify its signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -D dist
          go run ./tools/release verify -dir dist
          chmod +x dist/easm-agent-linux-amd64
          dist/easm-agent-linux-amd64 -version | grep -qx "easm-agent ${TAG#v}"

      - name: Start the agent on a throwaway data folder
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          EASM_KEY_PASSPHRASE="$(openssl rand -hex 24)" nohup dist/easm-agent-linux-amd64 \
            -data-dir "$RUNNER_TEMP/data" -listen 127.0.0.1:8080 -plain-http -no-browser > "$RUNNER_TEMP/agent.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/agent.log"; exit 1

      - name: ZAP baseline scan (fails on any medium or high alert)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://127.0.0.1:8080 -J zap.json -r zap.html -I
          jq -r '.site[].alerts[] | "\(.riskdesc)  \(.name)"' zap/zap.json | sort -u
          bad=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 2)] | length' zap/zap.json)
          [ "$bad" -eq 0 ] || { echo "::error::ZAP found $bad medium or high alert(s)"; exit 1; }

      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap/
          if-no-files-found: ignore

  uat-windows:
    name: "UAT: user acceptance, upgrade and service tests (Windows)"
    needs: release
    # !cancelled(): without a status function GitHub skips this job, because uat-passed (an ancestor) is skipped for an RC.
    if: ${{ !cancelled() && needs.release.result == 'success' && contains(github.ref_name, '-rc.') }}
    runs-on: windows-latest # elevated, so the service test can install a real service
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Download the pre-release, verify it, and fetch the current production release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download $env:TAG -D dist
          go run ./tools/release verify -dir dist
          if ($LASTEXITCODE) { exit 1 }
          $v = (& .\dist\easm-agent-windows-amd64.exe -version) -join ' '
          if ($v -ne "easm-agent $($env:TAG.TrimStart('v'))") { throw "the RC reports '$v'" }
          $prev = gh release view --json tagName --jq .tagName # latest non-pre-release
          gh release download $prev -p 'easm-agent-windows-amd64.exe' -D prev
          "Upgrade test from $prev"

      - name: UAT suite (lab scans, evidence, corroboration, upgrade, Windows service)
        shell: pwsh
        env:
          UAT_OUT: ${{ runner.temp }}\uat
        run: .\uat\run.ps1 -Exe .\dist\easm-agent-windows-amd64.exe -PreviousExe .\prev\easm-agent-windows-amd64.exe

      - name: Keep the UAT results (no credentials)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uat-results
          path: |
            ${{ runner.temp }}\uat\*-results.csv
            ${{ runner.temp }}\uat\lab.log
            ${{ runner.temp }}\uat\lab.err
          if-no-files-found: ignore
