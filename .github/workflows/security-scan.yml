name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, catches newly published CVEs between PRs
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Semgrep's native Windows build cannot run these rules, so the SAST gate runs here on Linux.
    container: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        # Explicit rulesets: "--config auto" only works with usage metrics switched on.
        run: >-
          semgrep scan --error --metrics=off
          --config p/default --config p/golang --config p/secrets --config p/owasp-top-ten
          --exclude web/static .

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # No Go code exists yet, so scan the workflow files themselves.
          # When the first Go code lands, change this to: actions, go
          languages: actions
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
