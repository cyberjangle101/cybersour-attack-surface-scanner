version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a newly published version, so a hijacked or broken release is caught first.
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same cooldown for modules. Security updates (Dependabot security updates) are not delayed by it.
    cooldown:
      default-days: 7
