# Exactly one replica, always. The agent keeps its data in SQLite with a single writer,
# takes an exclusive lock on its data folder, and schedules scans in-process: a second
# replica would wait for the lock forever (or, on separate disks, scan everything twice).
# A StatefulSet with one replica replaces the pod (old one gone, then new one) on updates,
# so the lock is always free for the new pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: easm-agent
spec:
  replicas: 1
  serviceName: easm-agent
  selector:
    matchLabels:
      app.kubernetes.io/name: easm-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easm-agent
    spec:
      serviceAccountName: easm-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: easm-agent
          image: easm-agent
          args: ["-config", "/etc/easm/config.yaml"]
          env:
            # Read from a mounted file, not an environment variable, so it does not show in
            # `kubectl exec ... env` or crash dumps. Swap the Secret for the Secret Store CSI
            # driver (Secret Manager / Key Vault) as docs/KUBERNETES.md shows.
            - name: EASM_KEY_PASSPHRASE_FILE
              value: /run/secrets/easm/passphrase
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          # The first start derives the encryption key before the web server answers.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/easm, readOnly: true}
            - {name: passphrase, mountPath: /run/secrets/easm, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: easm-agent-config
        - name: passphrase
          secret:
            secretName: easm-key-passphrase
            defaultMode: 0440
            items:
              - {key: passphrase, path: passphrase}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  # Block storage only (GCE Persistent Disk, Azure Disk, EBS). Not Filestore, Azure Files or
  # NFS: SQLite's WAL and the data-folder lock are not reliable on network file systems.
  # For zone failures use a regional PD (GKE) or a ZRS disk (AKS) storage class.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
