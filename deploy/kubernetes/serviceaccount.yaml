# The agent never talks to the Kubernetes API, so it gets no token and no RBAC.
# For Workload Identity (GKE) or Azure Workload Identity (AKS) with the Secret Store CSI
# driver, annotate this account as docs/KUBERNETES.md shows.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: easm-agent
automountServiceAccountToken: false
