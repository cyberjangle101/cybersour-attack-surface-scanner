{{define "content"}}
<div class="card narrow">
  <h1>Welcome to EASM Agent</h1>
  <p class="muted">Create the first administrator account. After this you can add the domains to monitor, and everything else (scanning, alerting, reporting) runs automatically.</p>
  {{if .Error}}<div class="flash bad">{{.Error}}</div>{{end}}
  <form method="post" action="/setup" autocomplete="off">
    <input type="hidden" name="csrf" value="{{.PreCSRF}}">
    <label>Username <input name="username" value="{{.Username}}" autocomplete="username" autofocus required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="10" required><span class="hint">At least 10 characters.</span></label>
    <label>Confirm password <input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
    <button class="btn primary" type="submit">Create administrator</button>
  </form>
</div>
{{end}}
